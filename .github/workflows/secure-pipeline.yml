name: Secure SDLC Pipeline

# Alvo de demonstração: target-app/ (PyGoat, clonado separadamente - ver README).
# Todo PR para main passa por todos os gates antes do merge ser liberado
# (enforçado pela proteção de branch, ver branch-protection/apply-branch-protection.sh).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write     # OIDC -> cloud, sem credencial estática (ponto 6)
  attestations: write # necessário para assinatura/attestation de artefato

jobs:

  # ---------------------------------------------------------------------
  # 1) SECRETS SCAN — todo o histórico, não só o diff
  # ---------------------------------------------------------------------
  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # ---------------------------------------------------------------------
  # 2) SAST
  # ---------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Instalar e rodar Semgrep
        run: |
          pip install semgrep
          semgrep scan --config p/owasp-top-ten target-app/ --error
  # ---------------------------------------------------------------------
  # 3) SCA + SBOM — geração de inventário de componentes, não só CVE conhecida
  # ---------------------------------------------------------------------
  sca-sbom:
    name: SCA + SBOM (OSV-Scanner + Syft)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: OSV-Scanner (vulnerabilidades conhecidas)
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            target-app/
        # Falha em CVE alta/crítica com exploit conhecido (KEV). Média/baixa
        # vira issue no backlog (ver SECURITY.md).
      - name: Gerar SBOM (Syft, formato CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: target-app/
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
        # SBOM versionado por build: permite checar exposição a uma CVE nova
        # publicada DEPOIS do deploy, sem precisar re-escanear tudo.

  # ---------------------------------------------------------------------
  # 4) IaC SCAN + POLICY AS CODE
  # ---------------------------------------------------------------------
  iac-scan:
    name: IaC Scan (Trivy) + Policy as Code (OPA/Conftest)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: terraform/
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Conftest (política própria, versionada em policy/)
        run: |
          docker run --rm -v "$PWD:/project" openpolicyagent/conftest test \
            /project/terraform/ --policy /project/policy/
        # Diferença chave: a política de segurança da infra fica em código
        # (policy/*.rego), versionada e revisada em PR — não configurada
        # manualmente numa UI de ferramenta de terceiro.

  # ---------------------------------------------------------------------
  # 5) CONTAINER SCAN + ASSINATURA DE ARTEFATO (supply chain)
  # ---------------------------------------------------------------------
  # Comentado nesta demonstração: depende de build de imagem Docker completa
  # do PyGoat + publicação em registry para a assinatura (cosign) fazer sentido.
  # Lógica documentada e pronta; não executada neste ambiente de case.
  #
  # container-scan-and-sign:
  #   name: Container Scan + Assinatura (Trivy + cosign)
  #   runs-on: ubuntu-latest
  #   needs: [sast, sca-sbom, iac-scan]
  #   if: github.ref == 'refs/heads/main'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Build image
  #       run: docker build -t app:${{ github.sha }} target-app/
  #     - name: Trivy image scan
  #       uses: aquasecurity/trivy-action@master
  #       with:
  #         image-ref: app:${{ github.sha }}
  #         severity: CRITICAL,HIGH
  #         exit-code: '1'
  #     - name: Assinar imagem (cosign / Sigstore, keyless via OIDC)
  #       uses: sigstore/cosign-installer@v3
  #     - run: cosign sign --yes app:${{ github.sha }}

  # ---------------------------------------------------------------------
  # 6) DAST — só em staging, após merge (custo/tempo)
  # ---------------------------------------------------------------------
  # Comentado nesta demonstração: depende de ambiente de staging real (cloud)
  # para o deploy e para o ZAP ter um alvo ao vivo para escanear.
  # Lógica documentada e pronta; não executada neste ambiente de case.
  #
  # dast-staging:
  #   name: DAST em Staging (OWASP ZAP)
  #   runs-on: ubuntu-latest
  #   if: github.ref == 'refs/heads/main'
  #   needs: container-scan-and-sign
  #   steps:
  #     - name: Deploy to staging (via OIDC, sem credencial estática)
  #       run: echo "deploy para staging"
  #     - uses: zaproxy/action-baseline@v0.12.0
  #       with:
  #         target: 'https://staging.exemplo.internal'

  security-gate:
    name: Security Gate (resumo)
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, sca-sbom, iac-scan]
    steps:
      - run: echo "Gates críticos aprovados — liberado para build/assinatura/deploy."
